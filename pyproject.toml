[project]
name = "hackaton-apk"
version = "0.1.0"
description = "End-to-end computer vision product for an agribusiness hackathon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0,<7",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "ultralytics==8.4.149",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.10,<5",
  "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
  "pytest-cov>=5,<7",
  "python-pptx>=1.0,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
